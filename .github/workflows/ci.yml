name: RJD Formal & Numerical Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-lean4:
    name: Verify Lean 4 Proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan and Lean 4
        run: |
          curl https://githubusercontent.com -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Generate manifest and build Lean 4 proofs
        run: |
          lake update
          lake build

  verify-python:
    name: Run Numerical Simulations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy

      - name: Execute RJD network simulation
        run: python simulations/rjd_network_sim.py

  build-latex-pdf:
    name: Compile LaTeX Treatise (XeLaTeX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile XeLaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/relational_jerk_dynamics.tex
          compiler: xelatex
          args: -interaction=nonstopmode -halt-on-error

      - name: Upload compiled PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relational-Jerk-Dynamics-Paper
          path: paper/relational_jerk_dynamics.pdf
