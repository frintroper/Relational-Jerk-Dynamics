  verify-lean4:
    name: Verify Lean 4 Proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Lean 4
        uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Run lake build with visible error log
        run: |
          if ! lake build > build.log 2>&1; then
            cat build.log >> $GITHUB_STEP_SUMMARY
            cat build.log
            exit 1
          fi
